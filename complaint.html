<!DOCTYPE html>
<html>

<head>
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Register Complaint</h2>
</header>

<div class="container">
    <div class="card">

        <input type="text" placeholder="Issue Title" required>

        <textarea placeholder="Describe your issue" required></textarea>

        <select>
            <option>Road Issue</option>
            <option>Water Problem</option>
            <option>Electricity</option>
            <option>Sanitation</option>
        </select>

        <input type="date" required>

        <input type="file" required>

        <select>
            <option>Collector</option>
            <option>MLA</option>
            <option>Councillor</option>
        </select>

        <br><br>

        <a href="success.html" class="btn">
            Submit Complaint
        </a>

    </div>
</div>

</body>
</html>
