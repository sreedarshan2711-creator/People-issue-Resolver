<!DOCTYPE html>
<html>

<head>
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Register Complaint</h2>
</header>

<div class="container">
    <div class="card">

        <!-- Issue Title -->
        <input type="text" id="title" placeholder="Issue Title" required>
        <br>

        <!-- Description -->
        <textarea id="description" placeholder="Describe your issue" required></textarea>
        <br>

        <!-- Complaint Category -->
        <select id="category" required>
            <option value="">Select Issue Type</option>
            <option>Road Issue</option>
            <option>Water Problem</option>
            <option>Electricity</option>
            <option>Sanitation</option>
        </select>
        <br>

        <!-- Date -->
        <input type="date" id="date" required>
        <br>

        <!-- File Upload -->
        <input type="file" id="file" required>
        <br>

        <!-- Authority -->
        <select id="authority" required>
            <option value="">Select Authority</option>
            <option>Collector</option>
            <option>MLA</option>
            <option>Councillor</option>
        </select>

        <br><br>

        <!-- Submit Button -->
        <button onclick="validateComplaint()">
            Submit Complaint
        </button>

    </div>
</div>

<script>

function validateComplaint() {

    let title = document.getElementById("title").value;
    let description = document.getElementById("description").value;
    let category = document.getElementById("category").value;
    let date = document.getElementById("date").value;
    let file = document.getElementById("file").value;
    let authority = document.getElementById("authority").value;

    // Check Empty Fields
    if(title === "" || description === "" || category === "" ||
       date === "" || file === "" || authority === "") {

        alert("Please fill all complaint details");
    }
    else {

        alert("Complaint Submitted Successfully");

        // Redirect to Success Page
        location.replace("success.html");
    }
}

</script>

</body>
</html>
