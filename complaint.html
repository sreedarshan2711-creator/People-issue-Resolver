<!DOCTYPE html>
<html>

<head>
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Register Complaint</h2>
</header>

<div class="container">
    <div class="card">

        <!-- Issue Title -->
        <input type="text" placeholder="Issue Title" required>
        <br>

        <!-- Description -->
        <textarea placeholder="Describe your issue" required></textarea>
        <br>

        <!-- Complaint Category -->
        <select required>
            <option value="">Select Issue Type</option>
            <option>Road Issue</option>
            <option>Water Problem</option>
            <option>Electricity</option>
            <option>Sanitation</option>
        </select>
        <br>

        <!-- Date -->
        <input type="date" required>
        <br>

        <!-- File Upload -->
        <input type="file" required>
        <br>

        <!-- Authority -->
        <select required>
            <option value="">Select Authority</option>
            <option>Collector</option>
            <option>MLA</option>
            <option>Councillor</option>
        </select>

        <br><br>

        <!-- Submit Button -->
        <a href="success.html">
            <button>Submit Complaint</button>
        </a>

    </div>
</div>

</body>
</html>
