<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>User/Admin Login</h2>
  </header>

  <div class="container">
    <div class="card">

      <!-- Username / Aadhaar -->
      <input type="text" placeholder="Username / Aadhaar" required>

      <!-- Password -->
      <input type="password" placeholder="Password" required>

      <!-- Role Selection -->
      <select required>
        <option value="user">User</option>
        <option value="admin">Collector Admin</option>
      </select>

      <br><br>

      <!-- Login Link -->
      <a href="complaint.html" class="btn">
        Login
      </a>

    </div>
  </div>

</body>
</html>
