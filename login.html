<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>User/Admin Login</h2>
  </header>

  <div class="container">
    <div class="card">
      <form action="complaint.html" method="post">
        <!-- Username / Aadhaar -->
        <input type="text" name="username" placeholder="Username / Aadhaar" required>

        <!-- Password -->
        <input type="password" name="password" placeholder="Password" required>

        <!-- Role Selection -->
        <select name="role" required>
          <option value="user">User</option>
          <option value="admin">Collector Admin</option>
        </select>

        <!-- Submit Button -->
        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
