<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>User/Admin Login</h2>
</header>

<div class="container">
    <div class="card">

        <!-- Username / Aadhaar -->
        <input type="text" placeholder="Username / Aadhaar" required>
        <br>

        <!-- Password -->
        <input type="password" placeholder="Password" required>
        <br>

        <!-- Role Selection -->
        <select required>
            <option value="">Select Role</option>
            <option value="user">User</option>
            <option value="admin">Collector Admin</option>
        </select>

        <br><br>

        <!-- Login Button -->
        <a href="complaint.html">
            <button>Login</button>
        </a>

    </div>
</div>

</body>
</html>
